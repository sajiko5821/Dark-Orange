# ==============================================================================
# Dark Orange - High Contrast Modern Home Assistant Theme
# Built on deep charcoal gray (#26282D & #2E3035) and vibrant orange (#E06242)
# Complete with root-level variables and modern Material 3 tokens
# ==============================================================================

Dark Orange:
  # --- View & Lovelace Backgrounds (Guarantees gray background everywhere) ---
  lovelace-background: "#26282D"
  view-background-color: "#26282D"
  primary-background-color: "#26282D"
  secondary-background-color: "#2E3035"
  clear-background-color: "#26282D"
  divider-color: "#26282D"

  # --- Base Primary & Accent Colors ---
  primary-color: "#E06242"
  light-primary-color: "#FF7D5C"
  accent-color: "#E06242"

  # --- RGB Channels (Crucial for cards, opacity, Mushroom, and badges) ---
  rgb-primary-color: 224, 98, 66
  rgb-accent-color: 224, 98, 66
  rgb-primary-text-color: 255, 255, 255
  rgb-secondary-text-color: 194, 199, 208
  rgb-text-primary-color: 255, 255, 255
  rgb-card-background-color: 46, 48, 53
  rgb-primary-background-color: 38, 40, 45
  rgb-secondary-background-color: 46, 48, 53

  # --- High Contrast Typography (Prevents black text & illegible gray text) ---
  primary-text-color: "#FFFFFF"
  secondary-text-color: "#C2C7D0"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "rgba(255, 255, 255, 0.45)"
  text-light-primary-color: "#FFFFFF"
  link-text-color: "#FF7D5C"

  # --- App Header & Navigation Bar ---
  app-header-background-color: "#2E3035"
  header-background-color: "#2E3035"
  app-header-text-color: "#FFFFFF"
  app-header-selection-bar-color: "#E06242"
  app-header-edit-background-color: "#2E3035"
  app-header-edit-text-color: "#FFFFFF"
  navigation-bar-background-color: "#2E3035"
  bottom-nav-bar-background-color: "#2E3035"

  # --- Sidebar ---
  sidebar-background-color: "#26282D"
  sidebar-text-color: "#C2C7D0"
  sidebar-icon-color: "#C2C7D0"
  sidebar-selected-background-color: "rgba(224, 98, 66, 0.16)"
  sidebar-selected-text-color: "#E06242"
  sidebar-selected-icon-color: "#E06242"

  # --- Cards & Surfaces ---
  card-background-color: "#2E3035"
  ha-card-background: "#2E3035"
  ha-card-border-radius: "10px"
  ha-card-border-width: "0px"
  ha-card-border-color: "rgba(255, 255, 255, 0.05)"
  ha-card-box-shadow: "none"
  paper-card-background-color: "#2E3035"
  material-background-color: "#2E3035"
  material-secondary-background-color: "#26282D"

  # --- Dialogs, Menus & Popups (Fixes black text & illegible popups) ---
  dialog-background-color: "#2E3035"
  dialog-surface-margin: "0px"
  ha-dialog-surface-background: "#2E3035"
  paper-dialog-background-color: "#2E3035"
  paper-dialog-color: "#FFFFFF"
  paper-listbox-background-color: "#26282D"
  paper-listbox-color: "#FFFFFF"
  paper-item-icon-color: "#C2C7D0"
  paper-item-icon-active-color: "#E06242"
  paper-item-icon_-_color: "#C2C7D0"
  paper-item-selected_-_background-color: "rgba(224, 98, 66, 0.16)"
  paper-tabs-selection-bar-color: "#E06242"

  # --- Form Inputs & Dropdowns ---
  input-fill-color: "#1E2024"
  input-dropdown-icon-color: "#E06242"
  input-ink-color: "#FFFFFF"
  input-label-ink-color: "#C2C7D0"
  input-disabled-fill-color: "rgba(255, 255, 255, 0.04)"
  input-disabled-ink-color: "rgba(255, 255, 255, 0.38)"
  input-idle-line-color: "rgba(255, 255, 255, 0.15)"
  input-hover-line-color: "rgba(255, 255, 255, 0.3)"

  # --- MDC / Material Web Components ---
  mdc-theme-primary: "#E06242"
  mdc-theme-secondary: "#E06242"
  mdc-theme-surface: "#2E3035"
  mdc-theme-background: "#26282D"
  mdc-theme-on-primary: "#FFFFFF"
  mdc-theme-on-secondary: "#FFFFFF"
  mdc-theme-on-surface: "#FFFFFF"
  mdc-theme-text-primary-on-background: "#FFFFFF"
  mdc-theme-text-secondary-on-background: "#C2C7D0"
  mdc-theme-text-icon-on-background: "#C2C7D0"
  mdc-theme-text-primary-on-light: "#FFFFFF"
  mdc-theme-text-secondary-on-light: "#C2C7D0"
  mdc-dialog-surface-fill-color: "#2E3035"
  mdc-dialog-surface-ink-color: "#FFFFFF"
  mdc-select-fill-color: "#1E2024"
  mdc-select-ink-color: "#FFFFFF"
  mdc-select-label-ink-color: "#C2C7D0"
  mdc-select-dropdown-icon-color: "#E06242"
  mdc-text-field-fill-color: "#1E2024"
  mdc-text-field-ink-color: "#FFFFFF"
  mdc-text-field-label-ink-color: "#C2C7D0"
  mdc-checkbox-checked-color: "#E06242"
  mdc-checkbox-unchecked-color: "#C2C7D0"
  mdc-radio-checked-color: "#E06242"
  mdc-radio-unchecked-color: "#C2C7D0"
  mdc-button-outline-color: "#E06242"

  # --- MD3 (Material Design 3) System Colors ---
  md-sys-color-surface: "#2E3035"
  md-sys-color-surface-container: "#2E3035"
  md-sys-color-surface-container-low: "#26282D"
  md-sys-color-surface-container-high: "#36393F"
  md-sys-color-surface-container-highest: "#2E3035"
  md-sys-color-on-surface: "#FFFFFF"
  md-sys-color-on-surface-variant: "#C2C7D0"
  md-sys-color-primary: "#E06242"
  md-sys-color-on-primary: "#FFFFFF"
  md-sys-color-primary-container: "rgba(224, 98, 66, 0.22)"
  md-sys-color-on-primary-container: "#FFFFFF"
  md-sys-color-outline: "rgba(255, 255, 255, 0.15)"
  md-sys-color-outline-variant: "rgba(255, 255, 255, 0.08)"

  # CSS Custom Property Aliases for MD3
  --md-sys-color-surface: "#2E3035"
  --md-sys-color-surface-container: "#2E3035"
  --md-sys-color-surface-container-low: "#26282D"
  --md-sys-color-surface-container-high: "#36393F"
  --md-sys-color-surface-container-highest: "#2E3035"
  --md-sys-color-on-surface: "#FFFFFF"
  --md-sys-color-on-surface-variant: "#C2C7D0"
  --md-sys-color-primary: "#E06242"
  --md-sys-color-on-primary: "#FFFFFF"
  --md-sys-color-primary-container: "rgba(224, 98, 66, 0.22)"
  --md-sys-color-on-primary-container: "#FFFFFF"

  # MD3 Navigation Bar & Tabs
  md-navigation-bar-container-color: "#2E3035"
  md-navigation-bar-icon-color: "#C2C7D0"
  md-navigation-bar-label-text-color: "#C2C7D0"
  md-navigation-bar-active-icon-color: "#E06242"
  md-navigation-bar-active-label-text-color: "#E06242"
  md-navigation-bar-active-indicator-color: "rgba(224, 98, 66, 0.22)"
  --md-navigation-bar-container-color: "#2E3035"

  # MD3 List items & Navigation rows
  md-list-item-label-text-color: "#FFFFFF"
  md-list-item-supporting-text-color: "#C2C7D0"
  md-list-item-active-indicator-color: "rgba(224, 98, 66, 0.22)"
  --md-list-item-label-text-color: "#FFFFFF"
  --md-list-item-supporting-text-color: "#C2C7D0"
  --md-list-item-active-indicator-color: "rgba(224, 98, 66, 0.22)"

  # --- Material You / MD3 Color Palette (Orange) ---
  ha-color-primary-05: "#2A0500"
  ha-color-primary-10: "#3E0800"
  ha-color-primary-20: "#631300"
  ha-color-primary-30: "#892306"
  ha-color-primary-40: "#E06242"
  ha-color-primary-50: "#CB5234"
  ha-color-primary-60: "#EC6B4A"
  ha-color-primary-70: "#FF8D6F"
  ha-color-primary-80: "#FFB6A4"
  ha-color-primary-90: "#FFDCD4"
  ha-color-primary-95: "#FFEFEC"

  # --- Material You / MD3 Color Palette (Neutral Grey) ---
  ha-color-neutral-05: "#101113"
  ha-color-neutral-10: "#1B1D20"
  ha-color-neutral-20: "#26282D"
  ha-color-neutral-30: "#2E3035"
  ha-color-neutral-40: "#3D3F44"
  ha-color-neutral-50: "#4D5056"
  ha-color-neutral-60: "#7A7C82"
  ha-color-neutral-70: "#9799A0"
  ha-color-neutral-80: "#BBBFC5"
  ha-color-neutral-90: "#D5CFCE"
  ha-color-neutral-95: "#E8E7E8"

  # --- Modern Semantic HA Color Tokens ---
  ha-color-text-primary: "#FFFFFF"
  ha-color-text-secondary: "#C2C7D0"
  ha-color-text-link: "#FF7D5C"
  ha-color-text-disabled: "rgba(255, 255, 255, 0.45)"
  ha-color-on-primary-loud: "#FFFFFF"
  ha-color-on-primary-normal: "#FFFFFF"
  ha-color-on-neutral-loud: "#FFFFFF"
  ha-color-on-neutral-normal: "#FFFFFF"
  wa-color-brand-on-loud: "#FFFFFF"
  wa-color-on-neutral-loud: "#FFFFFF"
  wa-color-on-quiet: "#C2C7D0"
  wa-color-brand-fill-loud: "#E06242"
  wa-color-brand-fill-normal: "rgba(224, 98, 66, 0.22)"
  wa-color-brand-fill-quiet: "rgba(224, 98, 66, 0.12)"
  wa-color-neutral-fill-loud: "#3E4146"
  wa-color-neutral-fill-normal: "#2E3035"
  wa-color-neutral-fill-quiet: "#26282D"

  # --- States & Badges ---
  state-icon-color: "#D5CFCE"
  state-icon-active-color: "#E06242"
  state-icon-unavailable-color: "rgba(255, 255, 255, 0.45)"
  state-active-color: "#E06242"
  state-inactive-color: "#D5CFCE"
  state-unavailable-color: "rgba(255, 255, 255, 0.45)"
  state-climate-heat-color: "#E06242"
  state-climate-cool-color: "#5F9BEA"
  state-climate-auto-color: "#80C884"
  state-cover-color: "#E06242"
  state-light-color: "#E06242"

  # --- Badges / Chips ---
  label-badge-background-color: "#1E2024"
  label-badge-text-color: "#FFFFFF"
  label-badge-red: "#D06568"
  label-badge-green: "#80C884"
  label-badge-blue: "#5F9BEA"
  label-badge-yellow: "#DFC271"
  label-badge-gray: "#5D6066"
  chip-background-color: "#1E2024"
  chip-color: "#FFFFFF"
  hacs-chip-background-color: "#E06242"

  # --- Switches & Controls ---
  switch-checked-button-color: "#E06242"
  switch-checked-track-color: "#C64423"
  switch-unchecked-button-color: "#D5CFCE"
  switch-unchecked-track-color: "#5D6066"
  paper-toggle-button-checked-button-color: "#E06242"
  paper-toggle-button-checked-bar-color: "#C64423"
  paper-toggle-button-unchecked-button-color: "#D5CFCE"
  paper-toggle-button-unchecked-bar-color: "#5D6066"

  # --- Sliders ---
  slider-color: "#E06242"
  slider-bar-color: "rgba(224, 98, 66, 0.35)"
  slider-secondary-color: "rgba(224, 98, 66, 0.6)"
  paper-slider-knob-color: "#E06242"
  paper-slider-knob-start-color: "#E06242"
  paper-slider-pin-color: "#E06242"
  paper-slider-active-color: "#E06242"
  paper-slider-secondary-color: "rgba(224, 98, 66, 0.6)"

  # --- Tables & Data (Settings & Entity Lists) ---
  data-table-background-color: "#26282D"
  table-row-background-color: "#2E3035"
  table-row-alternative-background-color: "#26282D"
  markdown-code-background-color: "#1E2024"
  code-editor-background-color: "#1E2024"

  # --- Energy Dashboard ---
  energy-grid-consumption-color: "#E06242"
  energy-grid-return-color: "#80C884"
  energy-solar-color: "#DFC271"
  energy-battery-in-color: "#5F9BEA"
  energy-battery-out-color: "#FF8A65"
  energy-gas-color: "#BA68C8"
  energy-water-color: "#4DD0E1"

  # --- Modes Block for HA Theme Selector compatibility ---
  modes:
    dark:
      lovelace-background: "#26282D"
      view-background-color: "#26282D"
      primary-background-color: "#26282D"
      secondary-background-color: "#2E3035"
      clear-background-color: "#26282D"
      card-background-color: "#2E3035"
      ha-card-background: "#2E3035"
      primary-text-color: "#FFFFFF"
      secondary-text-color: "#C2C7D0"
      app-header-background-color: "#2E3035"
      header-background-color: "#2E3035"
      navigation-bar-background-color: "#2E3035"
      bottom-nav-bar-background-color: "#2E3035"
      sidebar-background-color: "#26282D"
      md-sys-color-surface: "#2E3035"
      md-sys-color-surface-container: "#2E3035"
      md-sys-color-surface-container-low: "#26282D"
    light:
      lovelace-background: "#26282D"
      view-background-color: "#26282D"
      primary-background-color: "#26282D"
      secondary-background-color: "#2E3035"
      card-background-color: "#2E3035"
      ha-card-background: "#2E3035"
      primary-text-color: "#FFFFFF"
      secondary-text-color: "#C2C7D0"
      app-header-background-color: "#2E3035"
      header-background-color: "#2E3035"
      navigation-bar-background-color: "#2E3035"
      bottom-nav-bar-background-color: "#2E3035"
      sidebar-background-color: "#26282D"
