# ==============================================================================
# Dark Orange & Orange Dark - High Contrast Modern Home Assistant Theme
# Restores original gray (#282A2F & #303236) and vibrant orange (#DF6040)
# Complete with root-level variables and modern Material 3 tokens
# ==============================================================================

Dark Orange:
  # --- View & Lovelace Backgrounds (Guarantees gray background everywhere) ---
  lovelace-background: "#282A2F"
  view-background-color: "#282A2F"
  primary-background-color: "#282A2F"
  secondary-background-color: "#303236"
  clear-background-color: "#282A2F"
  divider-color: "#282A2F"

  # --- Base Primary & Accent Colors ---
  primary-color: "#DF6040"
  light-primary-color: "#FF7A59"
  accent-color: "#DF6040"

  # --- RGB Channels (Crucial for cards, opacity, Mushroom, and badges) ---
  rgb-primary-color: 223, 96, 64
  rgb-accent-color: 223, 96, 64
  rgb-primary-text-color: 255, 255, 255
  rgb-secondary-text-color: 197, 201, 208
  rgb-text-primary-color: 255, 255, 255
  rgb-card-background-color: 48, 50, 54
  rgb-primary-background-color: 40, 42, 47
  rgb-secondary-background-color: 48, 50, 54

  # --- High Contrast Typography (Prevents black text & illegible gray text) ---
  primary-text-color: "#FFFFFF"
  secondary-text-color: "#C5C9D0"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "rgba(255, 255, 255, 0.45)"
  text-light-primary-color: "#FFFFFF"
  link-text-color: "#FF7A59"

  # --- App Header & Navigation Bar (Original #303236 gray) ---
  app-header-background-color: "#303236"
  header-background-color: "#303236"
  app-header-text-color: "#FFFFFF"
  app-header-selection-bar-color: "#DF6040"
  app-header-edit-background-color: "#303236"
  app-header-edit-text-color: "#FFFFFF"
  navigation-bar-background-color: "#303236"
  bottom-nav-bar-background-color: "#303236"

  # --- Sidebar ---
  sidebar-background-color: "#282A2F"
  sidebar-text-color: "#C5C9D0"
  sidebar-icon-color: "#C5C9D0"
  sidebar-selected-background-color: "rgba(223, 96, 64, 0.16)"
  sidebar-selected-text-color: "#DF6040"
  sidebar-selected-icon-color: "#DF6040"

  # --- Cards & Surfaces (Original #303236 gray) ---
  card-background-color: "#303236"
  ha-card-background: "#303236"
  ha-card-border-radius: "10px"
  ha-card-border-width: "0px"
  ha-card-border-color: "rgba(255, 255, 255, 0.05)"
  ha-card-box-shadow: "none"
  paper-card-background-color: "#303236"
  material-background-color: "#303236"
  material-secondary-background-color: "#282A2F"

  # --- Dialogs, Menus & Popups (Fixes black text & illegible popups) ---
  dialog-background-color: "#303236"
  dialog-surface-margin: "0px"
  ha-dialog-surface-background: "#303236"
  paper-dialog-background-color: "#303236"
  paper-dialog-color: "#FFFFFF"
  paper-listbox-background-color: "#282A2F"
  paper-listbox-color: "#FFFFFF"
  paper-item-icon-color: "#C5C9D0"
  paper-item-icon-active-color: "#DF6040"
  paper-item-icon_-_color: "#C5C9D0"
  paper-item-selected_-_background-color: "rgba(223, 96, 64, 0.16)"
  paper-tabs-selection-bar-color: "#DF6040"

  # --- Form Inputs & Dropdowns ---
  input-fill-color: "#202124"
  input-dropdown-icon-color: "#DF6040"
  input-ink-color: "#FFFFFF"
  input-label-ink-color: "#C5C9D0"
  input-disabled-fill-color: "rgba(255, 255, 255, 0.04)"
  input-disabled-ink-color: "rgba(255, 255, 255, 0.38)"
  input-idle-line-color: "rgba(255, 255, 255, 0.15)"
  input-hover-line-color: "rgba(255, 255, 255, 0.3)"

  # --- MDC / Material Web Components ---
  mdc-theme-primary: "#DF6040"
  mdc-theme-secondary: "#DF6040"
  mdc-theme-surface: "#303236"
  mdc-theme-background: "#282A2F"
  mdc-theme-on-primary: "#FFFFFF"
  mdc-theme-on-secondary: "#FFFFFF"
  mdc-theme-on-surface: "#FFFFFF"
  mdc-theme-text-primary-on-background: "#FFFFFF"
  mdc-theme-text-secondary-on-background: "#C5C9D0"
  mdc-theme-text-icon-on-background: "#C5C9D0"
  mdc-theme-text-primary-on-light: "#FFFFFF"
  mdc-theme-text-secondary-on-light: "#C5C9D0"
  mdc-dialog-surface-fill-color: "#303236"
  mdc-dialog-surface-ink-color: "#FFFFFF"
  mdc-select-fill-color: "#202124"
  mdc-select-ink-color: "#FFFFFF"
  mdc-select-label-ink-color: "#C5C9D0"
  mdc-select-dropdown-icon-color: "#DF6040"
  mdc-text-field-fill-color: "#202124"
  mdc-text-field-ink-color: "#FFFFFF"
  mdc-text-field-label-ink-color: "#C5C9D0"
  mdc-checkbox-checked-color: "#DF6040"
  mdc-checkbox-unchecked-color: "#C5C9D0"
  mdc-radio-checked-color: "#DF6040"
  mdc-radio-unchecked-color: "#C5C9D0"
  mdc-button-outline-color: "#DF6040"

  # --- MD3 (Material Design 3) System Colors (Restores original nav bar gray) ---
  md-sys-color-surface: "#303236"
  md-sys-color-surface-container: "#303236"
  md-sys-color-surface-container-low: "#282A2F"
  md-sys-color-surface-container-high: "#383B40"
  md-sys-color-surface-container-highest: "#303236"
  md-sys-color-on-surface: "#FFFFFF"
  md-sys-color-on-surface-variant: "#C5C9D0"
  md-sys-color-primary: "#DF6040"
  md-sys-color-on-primary: "#FFFFFF"
  md-sys-color-primary-container: "rgba(223, 96, 64, 0.22)"
  md-sys-color-on-primary-container: "#FFFFFF"
  md-sys-color-outline: "rgba(255, 255, 255, 0.15)"
  md-sys-color-outline-variant: "rgba(255, 255, 255, 0.08)"

  # CSS Custom Property Aliases for MD3
  --md-sys-color-surface: "#303236"
  --md-sys-color-surface-container: "#303236"
  --md-sys-color-surface-container-low: "#282A2F"
  --md-sys-color-surface-container-high: "#383B40"
  --md-sys-color-surface-container-highest: "#303236"
  --md-sys-color-on-surface: "#FFFFFF"
  --md-sys-color-on-surface-variant: "#C5C9D0"
  --md-sys-color-primary: "#DF6040"
  --md-sys-color-on-primary: "#FFFFFF"
  --md-sys-color-primary-container: "rgba(223, 96, 64, 0.22)"
  --md-sys-color-on-primary-container: "#FFFFFF"

  # MD3 Navigation Bar & Tabs
  md-navigation-bar-container-color: "#303236"
  md-navigation-bar-icon-color: "#C5C9D0"
  md-navigation-bar-label-text-color: "#C5C9D0"
  md-navigation-bar-active-icon-color: "#DF6040"
  md-navigation-bar-active-label-text-color: "#DF6040"
  md-navigation-bar-active-indicator-color: "rgba(223, 96, 64, 0.22)"
  --md-navigation-bar-container-color: "#303236"

  # MD3 List items & Navigation rows
  md-list-item-label-text-color: "#FFFFFF"
  md-list-item-supporting-text-color: "#C5C9D0"
  md-list-item-active-indicator-color: "rgba(223, 96, 64, 0.22)"
  --md-list-item-label-text-color: "#FFFFFF"
  --md-list-item-supporting-text-color: "#C5C9D0"
  --md-list-item-active-indicator-color: "rgba(223, 96, 64, 0.22)"

  # --- Material You / MD3 Color Palette (Orange) ---
  ha-color-primary-05: "#290400"
  ha-color-primary-10: "#3C0700"
  ha-color-primary-20: "#611200"
  ha-color-primary-30: "#872105"
  ha-color-primary-40: "#DF6040"
  ha-color-primary-50: "#C95032"
  ha-color-primary-60: "#EB6948"
  ha-color-primary-70: "#FF8B6D"
  ha-color-primary-80: "#FFB4A2"
  ha-color-primary-90: "#FFDAD2"
  ha-color-primary-95: "#FFEDE9"

  # --- Material You / MD3 Color Palette (Neutral Grey - Original #282A2F & #303236) ---
  ha-color-neutral-05: "#111213"
  ha-color-neutral-10: "#1D1F21"
  ha-color-neutral-20: "#282A2F"
  ha-color-neutral-30: "#303236"
  ha-color-neutral-40: "#3F4145"
  ha-color-neutral-50: "#4F5257"
  ha-color-neutral-60: "#7C7D83"
  ha-color-neutral-70: "#999BA2"
  ha-color-neutral-80: "#BDC1C6"
  ha-color-neutral-90: "#D7D1D0"
  ha-color-neutral-95: "#EAE9EA"

